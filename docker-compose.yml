# study17: 프론트(Nginx) + 백엔드 + AI 프록시를 한 번에 실행한다.
#   docker compose up --build
#   http://localhost:8080
#
# backend 는 backend-django/ (공통 API 스펙 v1 구현). 다른 스펙 v1 서버로 바꿔도 프론트는 그대로다.
# 비밀 값(DJANGO_SECRET_KEY, DB_PASSWORD, ANTHROPIC_API_KEY)은 이 파일에 쓰지 않고 .env 파일(커밋 금지)에서 주입한다.
services:
  web:
    build:
      context: ./project/final
      args:
        VITE_API_BASE_URL: "" # 같은 도메인의 /api 사용 (nginx 가 프록시)
    ports:
      - "8080:80"
    depends_on:
      - backend
      - ai-proxy

  backend:
    build: ./backend-django # 공통 API 스펙 v1 을 구현한 Django 서버 (SQLite 기본, MySQL 은 DB_* 환경변수)
    environment:
      CORS_ORIGIN: http://localhost:8080
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key-change-me}
      DB_ENGINE: ${DB_ENGINE:-sqlite}
      DB_NAME: ${DB_NAME:-board}
      DB_USER: ${DB_USER:-board}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_HOST: ${DB_HOST:-}
    expose:
      - "8000"

  ai-proxy:
    build: ./ai-proxy
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      BOARD_API_BASE: http://backend:8000
    expose:
      - "8787"
