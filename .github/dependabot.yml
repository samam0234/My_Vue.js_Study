# study16: 의존성 업데이트 PR 을 자동으로 만든다. 메이저 업데이트는 PR 의 테스트·빌드 결과를 보고 병합한다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /project
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /ai-proxy
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /board-mcp
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /project
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
